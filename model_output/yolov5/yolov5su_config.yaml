# YOLOv5su (640x640) → RDK X5 (BPU bayes-e)
model_parameters:
  onnx_model: '/open_explorer/_project/yolov5/yolov5su.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: '/open_explorer/_project/yolov5/model_output'
  output_model_file_prefix: 'yolov5su_640x640_nv12'

input_parameters:
  input_name: 'images'
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'data_mean_and_scale'
  mean_value: '0 0 0'
  scale_value: '0.003921568627451 0.003921568627451 0.003921568627451'

calibration_parameters:
  cal_data_dir: '/open_explorer/_project/cal_data_dir/coco/coco128/images/train2017'
  cal_data_type: 'float32'
  preprocess_on: True
  calibration_type: 'max'
  max_percentile: 0.99996

compiler_parameters:
  compile_mode: 'latency'
  debug: True
  optimize_level: 'O3'
