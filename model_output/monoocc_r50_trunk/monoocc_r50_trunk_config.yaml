# MonoOcc R50 主干（ResNet50-C4 + FPN）→ RDK X5 (BPU bayes-e)
# 输入：1x3x384x1280（RGB 训练侧，ImageNet 归一化；NV12 运行时）
model_parameters:
  onnx_model: '/open_explorer/_project/Mono_Occupancy/R50/monoocc_r50_trunk.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: '/open_explorer/_project/Mono_Occupancy/R50/model_output'
  output_model_file_prefix: 'monoocc_r50_trunk_384x1280_nv12'

input_parameters:
  input_name: 'images'
  input_type_rt: 'nv12'                 # 板端摄像头直通
  input_type_train: 'rgb'               # MonoOcc 用 RGB 训练
  input_layout_train: 'NCHW'
  input_shape: '1x3x384x1280'
  norm_type: 'data_mean_and_scale'
  # torchvision Normalize(mean=[.485,.456,.406], std=[.229,.224,.225]) 换算到 0-255 域
  mean_value: '123.675 116.28 103.53'
  scale_value: '0.01712475383 0.01750700281 0.01742919390'

calibration_parameters:
  cal_data_dir: '/open_explorer/_project/cal_data_dir/coco/coco128/images/train2017'
  cal_data_type: 'float32'
  preprocess_on: True                   # True 才会解码 jpg（False 会当二进制读）
  calibration_type: 'max'
  max_percentile: 0.99996

compiler_parameters:
  compile_mode: 'latency'
  debug: True
  optimize_level: 'O3'
